<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Derby MvF Draft Reveal</title>
<style>
:root{--bg:#0b1630;--panel:#13244a;--red:#e63a2e;--yel:#f7d417;--ink:#fff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 0,#1b3166,var(--bg) 70%);color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:3px solid var(--red)}
header img{height:44px}
header h1{margin:0;font-size:clamp(18px,3.4vw,34px);font-weight:800;letter-spacing:.5px;flex:1}
header h1 span{color:var(--yel)}
#ctl{display:flex;gap:6px}
button{font:700 15px inherit;font-family:inherit;background:var(--red);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
button.alt{background:var(--panel);border:1px solid #3a5490}
button:focus-visible{outline:3px solid var(--yel)}
#grid{flex:1;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:auto repeat(9,1fr);gap:3px;padding:6px;min-height:0}
.h{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(11px,2.3vw,24px);padding:6px 2px;border-radius:5px 5px 0 0;text-align:center}
.c{background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.14);border-radius:4px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:clamp(7px,1.15vw,13px);line-height:1.05;padding:2px;overflow:hidden;word-break:break-word}
.c.on{border:1px solid transparent;animation:drop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-60px) scale(1.15);opacity:0}to{transform:none;opacity:1}}
.c.now{box-shadow:0 0 0 3px var(--yel),0 0 18px var(--yel)}
#call{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;text-align:center;padding:18px 34px;border-radius:14px;border:4px solid var(--yel);min-width:60vw;transition:all .3s cubic-bezier(.2,1.4,.4,1);z-index:5;box-shadow:0 10px 60px #000a}
#call.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#call b{display:block;font-size:clamp(30px,8vw,84px);line-height:1}
#call i{display:block;font-style:normal;font-size:clamp(16px,3.5vw,34px);margin-top:6px;letter-spacing:2px}
#intro,#end{position:fixed;inset:0;z-index:9;background:radial-gradient(ellipse at 50% 30%,#1b3166,var(--bg) 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px}
#intro img{max-height:52vh;max-width:80vw;filter:drop-shadow(0 8px 30px #000)}
#intro h2,#end h2{margin:0;font-size:clamp(30px,7vw,64px);line-height:1}
#intro h2 span,#end h2 span{color:var(--yel)}
#intro button{font-size:22px;padding:14px 38px;background:var(--yel);color:#0b1630}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){.c.on,#call{animation:none;transition:none}}
</style></head><body>

<script>
const T=[["Blacks","#111",'#fff',"Adam Rankin,Cammy Wood,Daniel Coppen,David Wiltshire,Jay Wilding,Martin Jones,Russell Lloyd,Sam Crawley,Will Johnson"],
["Blues","#1e6fe0",'#fff',"Alex Paradise,Daniel Spencer,Jake Renret,James Greaves,Martyn Jones,Mike Palmer,Mike Wright,Travis Prime"],
["Greens","#1fa64a",'#fff',"Adam Hattersley,Cameron Shepherd,Charlie Buxton,Chris Dolby,Ollie Fry,Paul Shepherd,Phil Baker,Sam Mapp,Scott Amott"],
["Greys","#8a919c",'#111',"Chris Paxton,Edward Martin,Gary Bosworth,Graeme Fulton,Jamie Spooner,James Jalalian,Jan Cica,Rhys Hickman,Shaun Mills"],
["Oranges","#f28a1a",'#111',"Adam Boardman,Anthony Bishop,Chad Ride,Huw Comerford,Jack Gourley,Quinten Evans,Reece Bentley,Simon Wright,Sonny Nanua"],
["Pinks","#f06ab0",'#111',"Adam Sheehan,Dan Hunt,John Smale,Josh Maher,Paul Fairbrass,Paul Gooding,Simon Smale,Tom Watson"],
["Purples","#8e44c9",'#fff',"Chris Mistry,Dale Village,Lee Coleman,Liam Seeds,Mark Mounteney,Rob Brookes,Sean Bromley,Stewart Mcqueen,Stuart Devine"],
["Reds","#e0261b",'#fff',"Adam Lomas,Colin Horton,Danny King,Glenn Shields,Harbir Guram,Mike Peach,Robert Haynes,Robert Moore"],
["Whites","#f4f4f4",'#111',"Brendan Guild,Callum Brentnall,Christian Smith,Karl Hatton,Lee Simpson,Rich Hadfield,Stephen Bradbury,Steven Galloway,Zach Beadle"],
["Yellows","#f7d417",'#111',"Aadam Khan,Anthony Talbot,Daniel Barrett,Dan Connolly,David Millward,Edward Hartshorn,Jack Darby,James Stewart,Joseph Barradell"]]
.map(t=>({n:t[0],bg:t[1],fg:t[2],p:t[3].split(",").sort((a,b)=>a.localeCompare(b))}));
const $=id=>document.getElementById(id),g=$("grid"),cells=[];
T.forEach(t=>{const h=document.createElement("div");h.className="h";h.textContent=t.n;h.style.cssText=`background:${t.bg};color:${t.fg}`;g.appendChild(h)});
for(let r=0;r<9;r++)T.forEach((t,c)=>{const d=document.createElement("div");d.className="c";g.appendChild(d);cells.push({d,t,name:t.p[r]||null,r,c})});
let order,idx,speed=1,paused=true,timer,run=0;
const speeds=[1,2,4],wait=ms=>new Promise(r=>{timer=setTimeout(r,ms/speed)});
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fill(s){s.d.textContent=s.name;s.d.style.background=s.t.bg;s.d.style.color=s.t.fg;s.d.classList.add("on")}
function reset(){cells.forEach(s=>{s.d.className="c";s.d.textContent="";s.d.style.background="";s.d.style.color=""});order=shuffle(cells.filter(s=>s.name));idx=0}
async function loop(){const me=++run;while(idx<order.length&&me===run){
 if(paused){await new Promise(r=>{timer=setTimeout(r,200)});continue}
 const s=order[idx];s.d.classList.add("now");
 const c=$("call");c.style.background=s.t.bg;c.style.color=s.t.fg;$("cn").textContent=s.name;$("ct").textContent=s.t.n;c.classList.add("show");
 await wait(1300);if(me!==run)return;
 c.classList.remove("show");s.d.classList.remove("now");fill(s);idx++;await wait(450)}
 if(me===run&&idx>=order.length){await wait(900);$("end").classList.remove("hide")}}
$("start").onclick=()=>{music();$("intro").classList.add("hide");paused=false;reset();loop()};
$("pp").onclick=()=>{paused=!paused;$("pp").textContent=paused?"Play":"Pause"};
$("sp").onclick=()=>{speed=speeds[(speeds.indexOf(speed)+1)%3];$("sp").textContent=speed+"x"};
$("skip").onclick=()=>{run++;clearTimeout(timer);$("call").classList.remove("show");order.slice(idx).forEach(fill);cells.forEach(s=>s.d.classList.remove("now"));idx=order.length;$("end").classList.remove("hide")};
let ac,mg,on=true;
function music(){if(ac||!on)return;try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
mg=ac.createGain();mg.gain.value=.22;mg.connect(ac.destination);
const ch=[[196,247,294,392],[220,262,330,440],[165,196,247,330],[196,247,294,392]],lead=[[392,494,588,784],[440,524,660,880],[330,392,494,660],[392,494,588,784]];
function n(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain(),l=ac.createBiquadFilter();o.type=type;o.frequency.value=f;l.type="lowpass";l.frequency.value=1800;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.08);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(l);l.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
function tim(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(45,t+.25);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.4)}
function sched(){const t0=ac.currentTime+.1;ch.forEach((c,i)=>{const t=t0+i*2;c.forEach(f=>n(f/2,t,2,"sawtooth",.09));c.forEach(f=>n(f,t,1.9,"sawtooth",.05));lead[i].forEach((f,j)=>n(f,t+j*.5,.9,"square",.07));for(let k=0;k<4;k++)tim(t+k*.5)})}
function groove(){const t0=ac.currentTime+.1,s=.25;
const bass=[[55,0,55,82.4,0,55,65.4,73.4],[55,0,55,82.4,0,98,82.4,65.4],[73.4,0,73.4,110,0,73.4,87.3,98],[82.4,0,82.4,0,82.4,98,110,123.5]],
lead=[[0,0,0,0,0,0,659,784],[880,0,880,784,0,659,0,0],[0,0,0,0,0,0,698,880],[988,0,988,880,0,784,659,0]],
stab=[[440,523,659],[440,523,659],[587,698,880],[494,659,831]];
const nb=ac.createBuffer(1,ac.sampleRate*.2,ac.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
function nt(f,t,du,ty,v,cut){const o=ac.createOscillator(),g=ac.createGain(),l=ac.createBiquadFilter();o.type=ty;o.frequency.value=f;l.type='lowpass';l.frequency.value=cut;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+du);o.connect(l);l.connect(g);g.connect(mg);o.start(t);o.stop(t+du+.05)}
function nz(t,hp,du,v){const r=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();r.buffer=nb;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+du);r.connect(f);f.connect(g);g.connect(mg);r.start(t)}
for(let b=0;b<4;b++)for(let i=0;i<8;i++){const t=t0+(b*8+i)*s;
if(bass[b][i])nt(bass[b][i],t,.24,'sawtooth',.35,600);
if(lead[b][i])nt(lead[b][i],t,.22,'square',.07,3000);
if(i==3||i==5||i==7)stab[b].forEach(f=>nt(f,t,.17,'sawtooth',.05,2600));
if(i%4==0||(i==3&&b%2))tim(t);
if(i==2||i==6)nz(t,1200,.18,.5);
nz(t,6000,.05,.2)}}
groove();setInterval(groove,8000)}
$("mu").onclick=()=>{on=!on;$("mu").textContent="Music: "+(on?"On":"Off");if(!ac){music();return}mg.gain.value=on?.22:0};
$("back").onclick=()=>$("end").classList.add("hide");
$("again").onclick=()=>{$("end").classList.add("hide");paused=false;$("pp").textContent="Pause";reset();loop()};
reset();
</script></body></html>
